stages:
  - lint
  - build
  - test
  - analysis
  - security
  - package
  - deploy

variables:
  APP_NAME: market-data-service
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: gcc:13
  before_script:
    - apt-get update && apt-get install -y cmake make
  script:
    - cmake --preset release
    - cmake --build --preset release
  artifacts:
    paths:
      - build/release/market-data-service

unit_tests:
  stage: test
  image: gcc:13
  before_script:
    - apt-get update && apt-get install -y cmake make
  script:
    - cmake --preset release
    - cmake --build --preset release
    - ctest --preset release

sanitizers:
  stage: test
  image: gcc:13
  before_script:
    - apt-get update && apt-get install -y cmake make
  script:
    - cmake --preset asan
    - cmake --build --preset asan
    - ctest --preset asan

docker_build:
  stage: package
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG

deploy_dev:
  stage: deploy
  image: alpine/helm:3.14.0
  script:
    - helm upgrade --install $APP_NAME ./helm/market-data-service --namespace dev --create-namespace --set image.repository=$CI_REGISTRY_IMAGE --set image.tag=$IMAGE_TAG

deploy_prod:
  stage: deploy
  image: alpine/helm:3.14.0
  when: manual
  only:
    - main
  script:
    - helm upgrade --install $APP_NAME ./helm/market-data-service --namespace prod --create-namespace --set image.repository=$CI_REGISTRY_IMAGE --set image.tag=$IMAGE_TAG
